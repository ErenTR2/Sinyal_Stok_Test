<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Ana Sayfa</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<header><img src="/logo.svg" alt="Logo" /><span>SİNYAL STOK SİSTEMİ</span></header>
<main>
  <h2 id="greeting"></h2>
  <a href="/cikis">Çıkış Yap</a>
</main>
<script>
  fetch('/api/me').then(r=>r.json()).then(d=>{
    if(!d.authenticated){
      window.location = '/giris';
    } else {
      document.getElementById('greeting').innerText = 'Hoş geldiniz, ' + d.username;
    }
  });
</script>
</body>
</html>
